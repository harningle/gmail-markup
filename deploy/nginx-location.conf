# gmail-markup MCP server. Goes inside the `listen 443` server block of your site's nginx
# config (e.g. /etc/nginx/sites-available/<site>), next to `location /`.
location /gmail-markup/ {
    proxy_pass http://127.0.0.1:8002;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
