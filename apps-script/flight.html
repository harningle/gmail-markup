<html lang="en">
<head>
  <title>Test Gmail Markup</title>

  <!-- Google Noto Sans font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500&display=swap"
        rel="stylesheet">

  <!-- Google material icon -->
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- Gmail reservation/trip card -->
  <style>

    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 800,
        'GRAD' 0,
        'opsz' 48;
      font-size: 20px;
      height: 20px;
      opacity: .71;
      width: 20px;
      margin-right: 10px;
    }

    div.card {
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 2px 0 rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15);
      margin: 8px 0 0 16px;
      overflow: hidden;
      padding: 0 40px;
    }

    div.card-container {
      overflow: hidden;
      height: auto;
      outline: unset;
      padding-bottom: 20px;
      transition-duration: .15s;
      transition-property: height;
      transition-timing-function: cubic-bezier(0.4,0,0.2,1);
    }

    div.header {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      position: relative;
    }

    div.title {
      -webkit-font-smoothing: antialiased;
      font-family: "Noto Sans",Roboto,RobotoDraft,Helvetica,Arial,sans-serif;
      font-size: 1rem;
      letter-spacing: normal;
      color: #222222;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 20px;
    }

    div.title-time {
      -webkit-font-smoothing: antialiased;
      font-family: "Noto Sans",Roboto,RobotoDraft,Helvetica,Arial,sans-serif;
      font-size: 0.875rem;
      letter-spacing: normal;
      color: #5f6368;
      line-height: 20px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    div.content {
      column-gap: 48px;
      columns: 288px 2;
    }

    div.info-container {
      align-items: center;
      display: flex;
      padding-top: 20px;
      page-break-inside: avoid;
    }

    div.info-content {
      flex: 2 .5 1px;
      min-width: 0;
    }

    div.info-title {
      -webkit-font-smoothing: antialiased;
      font-family: "Noto Sans", Roboto, RobotoDraft, Helvetica, Arial, sans-serif;
      font-size: .75rem;
      letter-spacing: normal;
      color: #5f6368;
      font-weight: 500;
      line-height: 16px;
      margin-bottom: 2px;
      margin-right: 24px;
    }

    div.info-text {
      -webkit-font-smoothing: antialiased;
      font-family: "Noto Sans", Roboto, RobotoDraft, Helvetica, Arial, sans-serif;
      font-size: .875rem;
      letter-spacing: normal;
      color: #202124;
      font-weight: 400;
      word-break: break-word;
      margin-right: 24px;
    }

    table {
      text-indent: initial;
    }
  </style>
</head>

<body>
